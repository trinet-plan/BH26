[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bh26-acmg"
version = "0.1.0"
description = "Evidence-first ACMG criterion evaluation for BH26 demo variants"
requires-python = ">=3.12"
dependencies = [
  "ga4gh.va-spec==0.5.0a4",
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.0"]

[project.scripts]
acmg = "acmg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"acmg.va_spec" = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
